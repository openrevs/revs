<form action="profile" method="post" xmlns="http://www.w3.org/1999/html">
  Email: <input name="email" type="text" value="{{ .email }}" /><br />
  Min rating:
  <input name="min_rating" type="text" value="{{ .User.Minrating }}" /><br />
  Max rating:
  <input name="max_rating" type="text" value="{{ .User.Maxrating }}" /><br />
  User ID: {{ .User.Userid }}<br />
  <br />
  <div class="form-group form-check">
    <input
      name="show_posters"
      type="checkbox"
      class="form-check-input"
      id="exampleCheck1"
      {{
      if
      .User.ShowPosters
      }}
      checked
      {{
      end
      }}
    />
    <label class="form-check-label" for="exampleCheck1">Show posters</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
