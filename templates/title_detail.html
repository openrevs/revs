<br /><br />
<h3>{{ .Title.Name }} ({{ .Title.Year }})</h3>
{{ if .Title.TMDBPosterURL }}
<a href="https://image.tmdb.org/t/p/original/{{ .Title.TMDBPosterURL }}"
  ><img
    src="https://image.tmdb.org/t/p/w500/{{ .Title.TMDBPosterURL }}"
    height="100px"
    alt="" /></a
><br />
{{ end }}<br />
Average Rating: {{ .AvgRating }}<br />
Rating Count: {{ .RatingCount }}<br />
<form
  action="/titles/{{ .Title.ID }}"
  method="post"
  xmlns="http://www.w3.org/1999/html"
>
  <label for="itemtype">Your Rating:</label>
  <select name="rating" id="rating">
    <option value="-">-</option>
    <option value="1" {{ if eq .UserRating 1 }} selected {{ end }}>
      1
    </option>
    <option value="2" {{ if eq .UserRating 2 }} selected {{ end }}>
      2
    </option>
    <option value="3" {{ if eq .UserRating 3 }} selected {{ end }}>
      3
    </option>
    <option value="4" {{ if eq .UserRating 4 }} selected {{ end }}>
      4
    </option>
    <option value="5" {{ if eq .UserRating 5 }} selected {{ end }}>
      5
    </option></select
  ><br />
  <label for="comment">Comment:</label>
  <textarea name="comment" id="comment">{{ .Comment }}</textarea>
  <button type="submit">Save</button>
</form>
