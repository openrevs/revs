{{define "content"}}
<h1>Watch history</h1>
{{if .Data}}
<table class="list">
  <thead><tr><th>Date</th><th>Movie</th><th>Rating</th><th>Review</th></tr></thead>
  <tbody>
  {{range .Data}}
  <tr>
    <td class="nowrap">{{with .ViewedOn}}{{.}}{{else}}<span class="muted">undated</span>{{end}}</td>
    <td><a href="/movies/{{.MovieID}}">{{.Title}}</a>{{with .Year}} <span class="muted">({{.}})</span>{{end}}</td>
    <td class="stars">{{stars .Rating}}</td>
    <td class="clip">{{.Review}}</td>
  </tr>
  {{end}}
  </tbody>
</table>
{{else}}
<p class="muted">No viewings yet.</p>
{{end}}
{{end}}
